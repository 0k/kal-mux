[package]
name = "kal-mux"
version = "%%version%%"
edition = "2021"
authors = ["Valentin Lab <valentin.lab@kalysto.org>"]
description = "A lightweight stream multiplexer for merging ordered async streams"
license = "MIT"
repository = "https://github.com/0k/kal-mux"
keywords = ["stream", "async", "merge", "multiplex", "ordered"]
categories = ["asynchronous"]
readme = "README.md"

[dependencies]
futures = "0.3.31"

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt"] }
